name: VV-Cockpit CI
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript und Funktionstests
        run: npm run check
      - name: Docker-Image bauen
        run: docker build -t vv-cockpit:ci .
